services:
  app:
    # Which build runs is set in ./.env by deploy/ota-deploy (driven by the GitHub Actions deploy job).
    image: ${APP_IMAGE:-ghcr.io/gaggimate/update-server:main}
    restart: unless-stopped
    environment:
      UPDATE_STORAGE_DIR: /data/storage
      # Uploads stay disabled (404) until ADMIN_API_KEY is set, e.g. in an .env file next to this one.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      # Every upload must carry a manifest signed by one of these Ed25519 keys (scripts/sign_release.py keygen).
      SIGNING_PUBLIC_KEY_FILE: /run/keys/release-signing-keys.pub.pem
    volumes:
      - ./storage:/data/storage:rw
      # Must exist before "up": Docker would otherwise create a directory here and uploads answer 503.
      - ./release-signing-keys.pub.pem:/run/keys/release-signing-keys.pub.pem:ro
    user: "1001:1001"
    read_only: true
    tmpfs:
      # Upload bodies are spooled here before they are verified and moved to storage.
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api').read()"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks:
      - proxy
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Routing lives in ./traefik/dynamic.yml, not in container labels: Traefik does not get the Docker socket.
  traefik:
    # Minor line only: on the server a weekly job pulls new patch releases, with health check and rollback.
    image: "traefik:v3.7"
    container_name: "traefik"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - proxy
    command:
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--entryPoints.websecure.http.tls=true"
      - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.le.acme.email=mail@gaggimate.eu"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./traefik:/etc/traefik/dynamic:ro"
      - "./letsencrypt:/letsencrypt"
    logging: *logging

networks:
  proxy:
    name: proxy
